name: shopflow
description: "ShopFlow — POS app for grocery / kiryana shops, mini marts, and convenience stores."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Code generation annotations
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Functional programming (Either)
  dartz: ^0.10.1

  # Navigation
  go_router: ^15.1.2

  # Networking
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.4

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3

  # UI & utilities
  intl: ^0.20.2
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.15
  mobile_scanner: ^7.4.0
  fl_chart: ^0.71.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  share_plus: ^13.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  injectable_generator: ^2.7.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
